<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1064 676" width="1064" height="676" role="img" aria-labelledby="title desc">
  <title id="title">Core classes and glue</title>
  <desc id="desc">Source plugins, Session tools, management routes and Settings call the Engine. The Engine reaches the Store, the Policy, the SourceRegistry, the MasterAssessor, the Executors registry and the Outbox through its ports. The MasterAssessor calls back with decide, and the Executors with the facts of their Assignments. The Executors registry sends each Assignment to the Executor it names, by default the DshExecutor. The MasterAssessor, the DshExecutor, Sessions and the Outbox enqueue effects, which run after commit and are kept in the Store.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 15px; font-weight: 600; }
    .big { font-size: 18px; font-weight: 600; }
    .sub { font-size: 12px; fill: #59636e; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #59636e; }
    .label { font-size: 12px; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    .glue { fill: #f6f8fa; stroke: #818b98; }
    .engine { fill: #fbefff; stroke: #8250df; }
    .part { fill: #ffffff; stroke: #c297ff; }
    .port { fill: #ddf4ff; stroke: #0969da; }
    .exec { fill: #dafbe1; stroke: #1a7f37; }
    .queue { fill: #fff8c5; stroke: #9a6700; }
    .edge { fill: none; stroke: #59636e; stroke-width: 1.6px; }
    .back { stroke-dasharray: 6 4; }
    .head { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #3d444d; }
      text { fill: #f0f6fc; }
      .sub, .code { fill: #9198a1; }
      .label { stroke: #0d1117; }
      .glue { fill: #151b23; stroke: #656c76; }
      .engine { fill: #2a1650; stroke: #ab7df8; }
      .part { fill: #0d1117; stroke: #8957e5; }
      .port { fill: #0c2d6b; stroke: #4493f8; }
      .exec { fill: #04260f; stroke: #3fb950; }
      .queue { fill: #2e2410; stroke: #d29922; }
      .edge { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="1063" height="675" rx="12"/>

  <!-- Glue that calls the Engine -->
  <rect class="glue" x="24" y="24" width="224" height="64" rx="10" stroke-width="1.5"/>
  <text class="title" x="136" y="50" text-anchor="middle">Source plugins</text>
  <text class="sub" x="136" y="70" text-anchor="middle">GitHub, Feishu, schedule</text>
  <rect class="glue" x="288" y="24" width="224" height="64" rx="10" stroke-width="1.5"/>
  <text class="title" x="400" y="50" text-anchor="middle">Session tools</text>
  <text class="sub" x="400" y="70" text-anchor="middle">main Session, Executor Sessions</text>
  <rect class="glue" x="552" y="24" width="224" height="64" rx="10" stroke-width="1.5"/>
  <text class="title" x="664" y="50" text-anchor="middle">Management routes</text>
  <text class="sub" x="664" y="70" text-anchor="middle">the panel's HTTP API</text>
  <rect class="glue" x="816" y="24" width="224" height="64" rx="10" stroke-width="1.5"/>
  <text class="title" x="928" y="50" text-anchor="middle">Settings</text>
  <text class="sub" x="928" y="70" text-anchor="middle">saves, Policy syncs</text>

  <line class="edge" x1="136" y1="88" x2="136" y2="148" marker-end="url(#arrow)"/>
  <text class="label" x="146" y="123">SourceContext</text>
  <line class="edge" x1="400" y1="88" x2="400" y2="148" marker-end="url(#arrow)"/>
  <text class="label" x="410" y="123">Engine roles</text>
  <line class="edge" x1="664" y1="88" x2="664" y2="148" marker-end="url(#arrow)"/>
  <text class="label" x="674" y="123">Engine roles</text>
  <line class="edge" x1="928" y1="88" x2="928" y2="148" marker-end="url(#arrow)"/>
  <text class="label" x="938" y="123">policyChanged</text>

  <!-- Engine -->
  <rect class="engine" x="24" y="150" width="1016" height="104" rx="10" stroke-width="1.5"/>
  <text class="big" x="44" y="180">Engine</text>
  <text class="sub" x="112" y="180">the only writer of Triggers, Threads, Decisions, Tickets and Assignments; emits a domain event after each change</text>
  <rect class="part" x="44" y="202" width="116" height="32" rx="7"/>
  <text class="title" x="102" y="223" text-anchor="middle">Intake</text>
  <rect class="part" x="172" y="202" width="116" height="32" rx="7"/>
  <text class="title" x="230" y="223" text-anchor="middle">Evals</text>
  <rect class="part" x="300" y="202" width="116" height="32" rx="7"/>
  <text class="title" x="358" y="223" text-anchor="middle">Tickets</text>
  <rect class="part" x="428" y="202" width="116" height="32" rx="7"/>
  <text class="title" x="486" y="223" text-anchor="middle">Assignments</text>
  <rect class="part" x="556" y="202" width="116" height="32" rx="7"/>
  <text class="title" x="614" y="223" text-anchor="middle">Replies</text>
  <text class="sub" x="692" y="223">five parts, each with one job</text>

  <!-- Ports -->
  <rect class="port" x="24" y="334" width="156" height="64" rx="10" stroke-width="1.5"/>
  <text class="title" x="102" y="360" text-anchor="middle">Store</text>
  <text class="code" x="102" y="380" text-anchor="middle">Repositories</text>
  <rect class="port" x="196" y="334" width="156" height="64" rx="10" stroke-width="1.5"/>
  <text class="title" x="274" y="360" text-anchor="middle">Policy</text>
  <text class="code" x="274" y="380" text-anchor="middle">Policy</text>
  <rect class="port" x="368" y="334" width="156" height="64" rx="10" stroke-width="1.5"/>
  <text class="title" x="446" y="360" text-anchor="middle">SourceRegistry</text>
  <text class="code" x="446" y="380" text-anchor="middle">SourceScope</text>
  <rect class="port" x="540" y="334" width="156" height="64" rx="10" stroke-width="1.5"/>
  <text class="title" x="618" y="360" text-anchor="middle">MasterAssessor</text>
  <text class="code" x="618" y="380" text-anchor="middle">Assessor</text>
  <rect class="port" x="712" y="334" width="156" height="64" rx="10" stroke-width="1.5"/>
  <text class="title" x="790" y="360" text-anchor="middle">Executors</text>
  <text class="code" x="790" y="380" text-anchor="middle">Executor</text>
  <rect class="port" x="884" y="334" width="156" height="64" rx="10" stroke-width="1.5"/>
  <text class="title" x="962" y="360" text-anchor="middle">Outbox</text>
  <text class="code" x="962" y="380" text-anchor="middle">Outbox</text>

  <line class="edge" x1="102" y1="254" x2="102" y2="332" marker-end="url(#arrow)"/>
  <text class="label" x="112" y="298">records</text>
  <line class="edge" x1="274" y1="254" x2="274" y2="332" marker-end="url(#arrow)"/>
  <line class="edge" x1="446" y1="254" x2="446" y2="332" marker-end="url(#arrow)"/>
  <line class="edge" x1="598" y1="254" x2="598" y2="332" marker-end="url(#arrow)"/>
  <line class="edge back" x1="638" y1="334" x2="638" y2="256" marker-end="url(#arrow)"/>
  <text class="label" x="646" y="298">decide</text>
  <line class="edge" x1="770" y1="254" x2="770" y2="332" marker-end="url(#arrow)"/>
  <line class="edge back" x1="810" y1="334" x2="810" y2="256" marker-end="url(#arrow)"/>
  <text class="label" x="818" y="290">started,</text>
  <text class="label" x="818" y="305">reports</text>
  <line class="edge" x1="962" y1="254" x2="962" y2="332" marker-end="url(#arrow)"/>

  <!-- Behind the ports -->
  <rect class="glue" x="196" y="440" width="156" height="56" rx="10" stroke-width="1.5"/>
  <text class="title" x="274" y="464" text-anchor="middle">Sessions</text>
  <text class="sub" x="274" y="482" text-anchor="middle">both roles' Sessions</text>
  <rect class="exec" x="712" y="440" width="156" height="56" rx="10" stroke-width="1.5"/>
  <text class="title" x="790" y="464" text-anchor="middle">DshExecutor</text>
  <text class="sub" x="790" y="482" text-anchor="middle">a Session per Ticket</text>
  <line class="edge" x1="790" y1="398" x2="790" y2="438" marker-end="url(#arrow)"/>
  <text class="label" x="800" y="423">dsh, the default</text>

  <!-- Effects -->
  <rect class="queue" x="196" y="552" width="844" height="64" rx="10" stroke-width="1.5"/>
  <text class="title" x="216" y="578">Effects</text>
  <text class="sub" x="216" y="598">the durable queue; each effect runs after its transaction commits</text>
  <text class="code" x="1020" y="578" text-anchor="end">assessment · dsh.launch · dsh.delivery</text>
  <text class="code" x="1020" y="598" text-anchor="end">relay · notice · reply · prune</text>

  <line class="edge" x1="274" y1="496" x2="274" y2="550" marker-end="url(#arrow)"/>
  <text class="label" x="284" y="528">enqueue</text>
  <line class="edge" x1="618" y1="398" x2="618" y2="550" marker-end="url(#arrow)"/>
  <text class="label" x="628" y="528">enqueue</text>
  <line class="edge" x1="790" y1="496" x2="790" y2="550" marker-end="url(#arrow)"/>
  <text class="label" x="800" y="528">enqueue</text>
  <line class="edge" x1="962" y1="398" x2="962" y2="550" marker-end="url(#arrow)"/>
  <text class="label" x="972" y="528">enqueue</text>

  <polyline class="edge" points="196,584 102,584 102,400" marker-end="url(#arrow)"/>
  <text class="label" x="112" y="470">effect rows,</text>
  <text class="label" x="112" y="485">the prune</text>

  <!-- Runtime -->
  <text class="sub" x="24" y="652">Runtime builds every part and hands each one only the interfaces it uses. It writes each domain event to the event table in the change's own transaction.</text>
</svg>
