<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-labelledby="title desc">
  <title id="title">A follow-up's state on one Ticket</title>
  <desc id="desc">A message that reaches a Ticket on a Thread of its own is delivered; one that reaches it only on a Thread the Ticket follows for context is context. Delivered becomes read when the Executor's Session takes every copy in a step, and delivered or read becomes taken when the Executor acknowledges or answers it. Delivered, read and taken own the message. Delivered, read and context become released when the Ticket ends before the message was read. Read, released and context go back to delivered when the message reaches the Ticket again. From any state, a hand-back makes it handedBack for good.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .state { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 600; }
    .title { font-size: 14px; font-weight: 600; }
    .sub { font-size: 12px; fill: #59636e; }
    .label { font-size: 12px; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    .group { fill: #fbefff; stroke: #8250df; stroke-dasharray: 6 4; }
    .own { fill: #ffffff; stroke: #8250df; }
    .other { fill: #f6f8fa; stroke: #818b98; }
    .final { fill: #fff1e5; stroke: #bc4c00; }
    .start { fill: #59636e; }
    .edge { fill: none; stroke: #59636e; stroke-width: 1.6px; }
    .head { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #3d444d; }
      text { fill: #f0f6fc; }
      .sub { fill: #9198a1; }
      .label { stroke: #0d1117; }
      .group { fill: #1c1233; stroke: #ab7df8; }
      .own { fill: #0d1117; stroke: #ab7df8; }
      .other { fill: #151b23; stroke: #656c76; }
      .final { fill: #2b1606; stroke: #db6d28; }
      .start { fill: #9198a1; }
      .edge { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="919" height="469" rx="12"/>

  <!-- Owning states -->
  <rect class="group" x="160" y="24" width="720" height="232" rx="12" stroke-width="1.5"/>
  <text class="title" x="180" y="50">Owning states</text>
  <text class="sub" x="290" y="50">the Ticket's Executor decides the message, which goes to no Eval</text>

  <rect class="own" x="180" y="176" width="150" height="48" rx="24" stroke-width="1.5"/>
  <text class="state" x="255" y="205" text-anchor="middle">delivered</text>
  <rect class="own" x="440" y="176" width="150" height="48" rx="24" stroke-width="1.5"/>
  <text class="state" x="515" y="205" text-anchor="middle">read</text>
  <rect class="own" x="710" y="176" width="150" height="48" rx="24" stroke-width="1.5"/>
  <text class="state" x="785" y="205" text-anchor="middle">taken</text>

  <!-- Other states -->
  <circle class="start" cx="64" cy="200" r="9"/>
  <text class="sub" x="64" y="228" text-anchor="middle">not reached</text>
  <rect class="other" x="180" y="330" width="150" height="48" rx="24" stroke-width="1.5"/>
  <text class="state" x="255" y="359" text-anchor="middle">context</text>
  <rect class="other" x="440" y="330" width="150" height="48" rx="24" stroke-width="1.5"/>
  <text class="state" x="515" y="359" text-anchor="middle">released</text>
  <rect class="final" x="710" y="330" width="150" height="48" rx="24" stroke-width="1.5"/>
  <text class="state" x="785" y="359" text-anchor="middle">handedBack</text>

  <!-- From not reached -->
  <line class="edge" x1="73" y1="200" x2="178" y2="200" marker-end="url(#arrow)"/>
  <text class="label" x="124" y="190" text-anchor="middle">reached</text>
  <polyline class="edge" points="64,238 64,354 178,354" marker-end="url(#arrow)"/>
  <text class="label" x="120" y="344" text-anchor="middle">for context</text>

  <!-- Within the owning states -->
  <line class="edge" x1="330" y1="190" x2="438" y2="190" marker-end="url(#arrow)"/>
  <text class="label" x="385" y="181" text-anchor="middle">every copy read</text>
  <line class="edge" x1="440" y1="212" x2="332" y2="212" marker-end="url(#arrow)"/>
  <text class="label" x="385" y="232" text-anchor="middle">reached again</text>
  <line class="edge" x1="590" y1="200" x2="708" y2="200" marker-end="url(#arrow)"/>
  <text class="label" x="649" y="190" text-anchor="middle">taken up</text>
  <path class="edge" d="M255,176 C255,96 785,96 785,174" marker-end="url(#arrow)"/>
  <text class="label" x="520" y="112" text-anchor="middle">taken up: the Executor acknowledged or answered it</text>

  <!-- Ending and reaching again -->
  <line class="edge" x1="330" y1="354" x2="438" y2="354" marker-end="url(#arrow)"/>
  <text class="label" x="385" y="344" text-anchor="middle">ended</text>
  <line class="edge" x1="270" y1="224" x2="445" y2="330" marker-end="url(#arrow)"/>
  <text class="label" x="340" y="296" text-anchor="end">ended</text>
  <line class="edge" x1="490" y1="330" x2="320" y2="226" marker-end="url(#arrow)"/>
  <text class="label" x="420" y="268">reached again</text>
  <line class="edge" x1="560" y1="224" x2="560" y2="328" marker-end="url(#arrow)"/>
  <text class="label" x="568" y="282">ended</text>
  <line class="edge" x1="210" y1="330" x2="210" y2="226" marker-end="url(#arrow)"/>
  <text class="label" x="202" y="282" text-anchor="end">reached again</text>

  <!-- Hand-back -->
  <line class="edge" x1="785" y1="256" x2="785" y2="328" marker-end="url(#arrow)"/>
  <text class="label" x="793" y="296">handed back,</text>
  <text class="label" x="793" y="311">from any state</text>
  <text class="sub" x="785" y="398" text-anchor="middle">for good</text>

  <text class="sub" x="24" y="428">Ended: the Ticket ended or could not resume before its Executor read the message. A take-up stands through a new copy and the end.</text>
  <text class="sub" x="24" y="448">When no Ticket owns the message, it goes to a fresh Eval, unless a Ticket took it up or a Decision settled it.</text>
</svg>
