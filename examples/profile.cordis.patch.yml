# Example profile configuration ($DSH_HOME/profiles/<profile>/cordis.patch.yml).
# Replace <placeholders> before first start; see docs/006-deployment.md.
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082
- id: dsh-superagent
  config:
    stateDir: <absolute path, for example /home/me/.dsh/state/superagent>
# Feishu is optional: uncomment to enable its Source, then set the bot's lark-cli on the Feishu Source.
# - id: dsh-superagent-feishu
#   disabled: false
# The schedule Source is optional too: uncomment to enable it, then add its entries on the Schedule Source.
# - id: dsh-superagent-schedule
#   disabled: false
# DingTalk is optional too: uncomment to enable its Source, then set where its app credentials are on the DingTalk Source.
# - id: dsh-superagent-dingtalk
#   disabled: false
# The code-host Source is optional: uncomment to enable it, then set its adapter and repository on the Code host Source (docs/010).
# - id: dsh-superagent-codehost
#   disabled: false
